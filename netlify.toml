[build]
  # Tests run before the build, and their exit code gates it: if `npm test`
  # fails, `&&` short-circuits and `vite build` never runs, so a real
  # regression can't reach production just because the frontend still
  # compiles. This is what makes the test suite actually enforce anything —
  # tests that only ever get run by hand don't catch what nobody remembered
  # to run.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  # @supabase/supabase-js constructs a RealtimeClient the moment
  # createClient() is called — even though none of these functions ever
  # open a realtime channel — and that construction unconditionally checks
  # for a native WebSocket global. Node only ships that natively from v22.
  # On Node 20 every function that calls createClient() (which is nearly
  # all of them: chat, onboarding, scans, billing) crashed with a 502 the
  # instant it ran, regardless of auth — "Node.js detected but native
  # WebSocket not found." Bumped to 22 to match, since pinning an older
  # supabase-js instead would just be deferring the same fix.
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
