[build]
  # Tests run before the build, and their exit code gates it: if `npm test`
  # fails, `&&` short-circuits and `vite build` never runs, so a real
  # regression can't reach production just because the frontend still
  # compiles. This is what makes the test suite actually enforce anything —
  # tests that only ever get run by hand don't catch what nobody remembered
  # to run.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  # @supabase/supabase-js constructs a RealtimeClient the moment
  # createClient() is called — even though none of these functions ever
  # open a realtime channel — and that construction unconditionally checks
  # for a native WebSocket global. Node only ships that natively from v22.
  # On Node 20 every function that calls createClient() (which is nearly
  # all of them: chat, onboarding, scans, billing) crashed with a 502 the
  # instant it ran, regardless of auth — "Node.js detected but native
  # WebSocket not found." Bumped to 22 to match, since pinning an older
  # supabase-js instead would just be deferring the same fix.
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 2026-08-26 security-header audit: added challenges.cloudflare.com
    # (Turnstile's widget script + challenge iframe — src/components/
    # Turnstile.jsx injects api.js and renders the challenge in an iframe
    # from that host). This was a REAL gap, not theoretical: Login.jsx
    # already requires Turnstile on signup in production as of this same
    # audit round, and the CSP as it stood before this change would have
    # silently blocked both the script and the iframe, breaking signup
    # entirely rather than just failing loudly. Also added object-src/
    # base-uri/form-action — standard 2026 hardening on top of default-src,
    # cheap and non-breaking (this app never uses plugin content, a <base>
    # tag, or submits a form to anywhere but itself).
    #
    # Scoped to what the app actually calls from the browser (confirmed via
    # grep, not guessed): Supabase (auth/DB/storage/edge functions), Google
    # Fonts (index.html's <link>), PostHog (analytics.js), and now Turnstile
    # — everything else (Anthropic, Apollo, Stripe's server API) is only
    # ever called server-side from Netlify functions, never directly from
    # the browser. Stripe's hosted Checkout/Portal pages are full-page
    # redirects, not an embedded frame or script, so no stripe.com entry is
    # needed here.
    #
    # 2026-08-31: script-src only allowlisted eu-assets.i.posthog.com, but
    # analytics.js (src/lib/analytics.js) defaults api_host to
    # us.i.posthog.com and only switches region via an optional
    # VITE_POSTHOG_HOST env var — connect-src already allowed both regions
    # for ordinary event capture, but PostHog's session-replay recorder is
    # fetched as its own script chunk from "<region>-assets.i.posthog.com",
    # which is governed by script-src, not connect-src. If production is on
    # the (default) US region, that recorder script would be silently
    # CSP-blocked — replay would just never start, with nothing else
    # visibly broken, since regular tracking doesn't touch this host at
    # all. Allowlisting both region asset hosts here removes the
    # dependency on knowing which region is actually configured in
    # Netlify's env vars.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://eu-assets.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://us.i.posthog.com https://eu.i.posthog.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    # Missing entirely before this audit — Netlify's automatic TLS does NOT
    # inject this by default (it's a separate dashboard opt-in under Domain
    # settings, invisible from this repo), so a SaaS with login/billing
    # shouldn't rely on that being toggled somewhere nobody can see in
    # version control. includeSubDomains/preload assume every subdomain
    # under meetannie.ai genuinely serves HTTPS-only — confirm that holds
    # before this is submitted to any browser preload list.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Missing entirely before this audit — cheap, standard baseline that
    # closes off browser APIs this app never uses. payment=() assumes
    # Stripe stays a full-page Checkout/Portal redirect (true today, see
    # the CSP comment above) rather than an embedded Payment Request API —
    # revisit if that ever changes.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()"

# A scale-readiness audit (2026-08-22) found every push building straight
# against production with no rehearsal environment. This context override
# is a real step toward that — Netlify's own deploy-preview/branch-deploy
# builds already run in an isolated URL — but it only fully protects
# production once DEPLOY_PREVIEW-scoped env vars are set in the Netlify UI
# pointing at a SEPARATE Supabase project and Stripe test-mode keys (a real
# infra/cost decision, not something to provision silently). Until that
# second Supabase project exists, previews still share production's
# database — this block is the wiring, not the isolation itself.
[context.deploy-preview]
  command = "npm test && npm run build"

[context.branch-deploy]
  command = "npm test && npm run build"

# parse-cv / parse-cvs-bulk-background (CV auto-fill, item 3) are the first
# functions in this repo to depend on a package with a binary-adjacent asset
# file loaded at runtime rather than via a static import: pdfjs-dist's
# "fake worker" (its main-thread fallback, used since these functions never
# spawn a real Worker thread) still needs to dynamically resolve its own
# pdf.worker.mjs relative to where pdfjs-dist ships. Verified directly
# against Netlify's real bundler (@netlify/zip-it-and-ship-it, not just a
# manual esbuild test) that its dependency-tracing step ships pdf.mjs but
# — because that resolution is dynamic, not a static import the tracer can
# see — silently drops pdf.worker.mjs, which would have surfaced in
# production as "Cannot find module '.../pdf.worker.mjs'" on the very first
# real PDF upload. `included_files` is Netlify's documented mechanism for
# exactly this gap (a traced dependency missing one non-statically-resolved
# file) — confirmed fixed by re-running the same real bundler with this
# config and then actually invoking the shipped output (real PDF + real
# DOCX through pdfjs-dist/mammoth from the exact unpacked zip contents) end
# to end. mammoth needed no such entry: it's shipped as a normal external
# CJS dependency and its own internal `require("fs")` resolves natively,
# with no bundling shim involved.
[functions."parse-cv"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[functions."parse-cvs-bulk-background"]
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]
