[build]
  # Tests run before the build, and their exit code gates it: if `npm test`
  # fails, `&&` short-circuits and `vite build` never runs, so a real
  # regression can't reach production just because the frontend still
  # compiles. This is what makes the test suite actually enforce anything —
  # tests that only ever get run by hand don't catch what nobody remembered
  # to run.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  # Vitest (added for the test suite that gates this build, see the comment
  # above) requires Node 20+ to run at all — it doesn't support Node 18.
  # This was left at 18 when the test suite was first wired in, which meant
  # `npm test` failed on Netlify's build machine before it ever reached real
  # test results, well before it got anywhere near actual app code. Bumped
  # to the current LTS.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
